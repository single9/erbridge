[package]
name = "erbridge"
version = "0.2.0"
edition = "2024"
authors = ["Duye Chen <k078264@gmail.com>"]
license = "MIT"

[features]
default = ["cli"]
# Command-line parsing and the terminal UI. Embedders that only want the
# tunnel library can build with `default-features = false`.
cli = ["dep:clap", "dep:crossterm", "dep:ratatui"]

[[bin]]
name = "erbridge"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"], optional = true }
crossterm = { version = "0.29.0", optional = true }
futures = "0.3.34"
rand = "0.10.2"
ratatui = { version = "0.30.2", optional = true }
rcgen = "0.14.10"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
snow = { version = "0.10.0", features = ["ring-accelerated"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.19", features = ["compat", "rt"] }
toml = "1.1.5"
yamux = "0.14.0"

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "latency"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
