[package]
name = "erbridge"
version = "0.1.0"
edition = "2024"
authors = ["Duye Chen <k078264@gmail.com>"]
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
futures = "0.3.34"
rand = "0.10.2"
ratatui = "0.30.2"
rcgen = "0.14.10"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
toml = "1.1.5"
yamux = "0.14.0"

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "latency"
harness = false
