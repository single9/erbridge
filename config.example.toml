# Example erbridge config file. Copy it to config.toml and edit as needed,
# then run with `erbridge --config config.toml <forward|serve|connect>`.
#
# The sections are independent; the same config file can fill in just one:
#   forward  direct forwarding: external port -> internal target host:port (TCP/UDP)
#   serve    reverse mode role A: waits for connect (B) to connect in, then exposes a port externally
#   connect  reverse mode role B: connects to serve (A), forwards received traffic to a local target
#   client   companion to a forward mapping with a `transport`: local plaintext listener -> that transport -> that mapping

# ---- forward: can be repeated for multiple mappings ----
[[forward]]
name = "web"                 # optional, used only for display/log
listen = "0.0.0.0:8080"      # externally listening address
target = "10.0.0.5:80"       # internal target
protocol = "both"            # tcp | udp | both (default both)

[[forward]]
name = "dns"
listen = "0.0.0.0:5353"
target = "10.0.0.5:53"
protocol = "udp"
udp_idle_secs = 60           # how long a UDP pseudo-connection can be idle before it's considered ended (default 60)

[[forward]]
name = "tls-web"
listen = "0.0.0.0:8443"
target = "10.0.0.5:80"       # this leg (erbridge -> target) stays plaintext
protocol = "tcp"             # a transport only supports tcp, not udp/both
transport = "tls"            # wraps the listen-side connection in TLS (self-signed, generated at startup;
                              # see README's Security notes). Interoperable with any TLS client.
token = "change-me"          # optional: if set, the connecting side must present this token right
                              # after the TLS handshake, so only erbridge's own `client` mode (or the
                              # same handshake) can connect -- otherwise any TLS client
                              # (curl -k, openssl s_client, ...) works

[[forward]]
name = "noise-web"
listen = "0.0.0.0:8444"
target = "10.0.0.5:80"
protocol = "tcp"
transport = "noise"          # wraps the listen-side connection in the Noise protocol (see README's
                              # Security notes). Only erbridge's own `client` mode can connect -- there
                              # is no generic Noise client the way curl speaks TLS.
token = "change-me"          # required under transport = "noise": hashed into the handshake's
                              # pre-shared key, rather than checked afterward like the tls transport does

# ---- client: companion to a forward mapping with a `transport` above, can be repeated ----
[[client]]
name = "tls-web"
listen = "127.0.0.1:1080"    # local plaintext address your own client app connects to
server = "A_IP:8443"         # the secured forward mapping's external address
transport = "tls"            # must match that mapping's transport (default tls)
token = "change-me"          # must match that mapping's token, if it set one

[[client]]
name = "noise-web"
listen = "127.0.0.1:1081"
server = "A_IP:8444"
transport = "noise"
token = "change-me"          # required under transport = "noise"

# ---- serve: role A, waits for B to connect ----
[serve]
listen = "0.0.0.0:9000"      # control port that B connects to
token = "change-me"          # shared secret B must provide
# Each tunnel corresponds to one externally exposed port; the final
# destination is decided by the [[connect.tunnel]] with the same name on B's side
[[serve.tunnel]]
name = "web"
external = "0.0.0.0:8081"

# ---- connect: role B, connects to A ----
[connect]
server = "1.2.3.4:9000"      # A's control address
token = "change-me"          # must match serve.token
reconnect_min_secs = 1       # starting interval for reconnect retries
reconnect_max_secs = 30      # max interval for reconnect retries (exponential backoff)
[[connect.tunnel]]
name = "web"                 # must match the tunnel name on serve's side
target = "127.0.0.1:80"      # final target on B's local machine (or internal network B can reach)
