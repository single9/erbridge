[package]
name = "erbridge"
description = "TCP/UDP port forwarder and reverse (NAT-traversal) tunnel with a terminal UI and a multi-tenant mode"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["tunnel", "port-forwarding", "reverse-proxy", "nat-traversal", "noise-protocol"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
erbridge-core = { workspace = true }
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
rustls-pki-types = "1.15.1"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
