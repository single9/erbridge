[package]
name = "erbridge"
description = "TCP/UDP port forwarding and reverse tunnels, with a terminal UI"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
erbridge-core = { path = "../erbridge-core" }
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
