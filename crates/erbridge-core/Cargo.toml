[package]
name = "erbridge-core"
description = "TCP/UDP forwarding and reverse tunnels over Noise, with a multi-tenant SNI-routed server, as a library"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["tunnel", "port-forwarding", "reverse-tunnel", "noise-protocol", "sni"]
categories = ["network-programming", "asynchronous"]

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
rand = "0.10.2"
rcgen = "0.14.10"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
snow = { version = "0.10.0", features = ["ring-accelerated"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.19", features = ["compat", "rt"] }
toml = "1.1.5"
yamux = "0.14.0"

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio", "html_reports"] }
tempfile = "3"

[[bench]]
name = "latency"
harness = false
